name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore and Signing Config
        run: |
          mkdir -p android/app
          # Decode keystore and key.properties from GitHub Secrets if available,
          # otherwise fallback to repo build keys
          if [ -n "${{ secrets.KEYSTORE_JKS_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_JKS_BASE64 }}" | base64 --decode > android/app/transportone-release.jks
          else
            echo "" | base64 --decode > android/app/transportone-release.jks
          fi

          if [ -n "${{ secrets.KEY_PROPERTIES_BASE64 }}" ]; then
            echo "${{ secrets.KEY_PROPERTIES_BASE64 }}" | base64 --decode > android/key.properties
          else
            echo "storePassword=TransportOneSecureKey2026" > android/key.properties
            echo "keyPassword=TransportOneSecureKey2026" >> android/key.properties
            echo "keyAlias=transportone" >> android/key.properties
            echo "storeFile=transportone-release.jks" >> android/key.properties
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename APK for Distribution
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk TransportOne-Release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportOne-Release-APK
          path: TransportOne-Release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Transport One Latest Release (Auto-Updated)"
          body: |
            ## Transport One Latest Auto-Build
            This APK is automatically built on every `git push` to `main`.
            
            - **Commit:** ${{ github.sha }}
            - **Date:** $(date -u +'%Y-%m-%d %H:%M UTC')
            
            Download the attached `TransportOne-Release.apk` directly to your phone.
          files: TransportOne-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
