name: FleetRoute CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      JWT_SECRET: fleetroute-ci-only-secret-change-per-environment-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Install server dependencies
        run: npm --prefix server ci
      - name: Install client dependencies
        run: npm --prefix client ci
      - name: Core logic tests
        run: npm test
      - name: Isolated integration tests
        run: npm run test:integration
      - name: Production client build
        run: npm run build
