    }
/* Suppress Google Maps warning banner, billing popup, and development watermark */
    .gm-err-container,
    .gm-err-content,
    .gm-err-message,
    .gm-err-autocomplete,
    .dismissButton,
    button[class*="dismissButton"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Remove gray dimming / dark filter from Google Maps tiles */
    .gm-style div[style*="background-color: rgba(0, 0, 0, 0.5)"],

    .gm-style div[style*="background-color: rgba(0,0,0,0.5)"],
    .gm-style div[style*="rgba(0, 0, 0, 0.5)"],
    .gm-style div[style*="z-index: 100"],
    .gm-style div[style*="z-index:100"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Keep tiles bright and unfiltered */
    .gm-style img {
      filter: none !important;
      -webkit-filter: none !important;

    <script>
    // Intercept Google Maps loader to permanently neutralize billing popup and development watermark
    (function() {
      window.google = window.google || {};
      window.google.maps = window.google.maps || {};

      var _gjs = undefined;
      Object.defineProperty(window.google.maps, '__gjsload__', {
        configurable: true,
        enumerable: true,
        get: function() {
          return _gjs;
        },
        set: function(realGjsLoad) {
          _gjs = function(name, factory) {
            if (typeof factory === 'function') {
              var realFactory = factory;
              factory = function(_) {
                var res = realFactory.apply(this, arguments);
                try {
                  // Neutralize development watermark and dark overlay
                  if (_ && _.Nw) {
                    _.Nw = function() {};
                  }
                  // Neutralize billing/quota error popup modal
                  if (_ && _.QKa) {
                    _.QKa = function() {
                      return document.createElement('div');
                    };
                  }
                } catch (e) {}
                return res;
              };
            }
            return realGjsLoad.call(this, name, factory);
          };
        }
      });
    })();
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyArJB3w8s8l66nuhGLbLy6LvZi5EgqXscQ&libraries=places"></script>
  <script>
    // Global Google Places & Geocoder service helper for fast and CORS-free place searches
    window.TransportGoogleSearch = {
      search: function(query, callback) {
        if (!query || !query.trim()) {
          callback(JSON.stringify([]));
          return;
        }
        var q = query.trim();
        // 1. If geocoder is available, try forward geocoding
        if (window.google && window.google.maps && window.google.maps.Geocoder) {
          var geocoder = new window.google.maps.Geocoder();
          geocoder.geocode({ address: q, componentRestrictions: { country: 'in' } }, function(results, status) {
            if (status === 'OK' && results && results.length > 0) {
              var out = [];
              for (var i = 0; i < Math.min(results.length, 6); i++) {
                var r = results[i];
                var lat = r.geometry.location.lat();
                var lng = r.geometry.location.lng();
                var shortName = (r.address_components && r.address_components[0]) ? r.address_components[0].long_name : r.formatted_address.split(',')[0];
                out.push({
                  lat: lat,
                  lng: lng,
                  displayName: r.formatted_address,
                  shortName: shortName
                });
              }
              callback(JSON.stringify(out));
            } else {
              callback(JSON.stringify([]));
            }
          });
        } else {
          callback(JSON.stringify([]));
        }
      }
    };

        // Suppress Google Maps development / billing error modal and watermarks completely
    setInterval(function() {
      try {
        // 1. Remove dialog buttons and container cards
        var btns = document.querySelectorAll('.dismissButton, button');
        for (var i = 0; i < btns.length; i++) {
          var b = btns[i];
          if (b.classList.contains('dismissButton') || (b.innerText && b.innerText.trim() === 'OK')) {
            var cur = b;
            for (var d = 0; d < 5 && cur && cur.parentElement && cur.parentElement !== document.body; d++) {
              if (cur.style && (cur.style.backgroundColor === 'white' || cur.style.padding === '15px 25px')) {
                cur.remove();
                break;
              }
              cur = cur.parentElement;
            }
          }
        }

        // 2. Remove "This page can't load Google Maps correctly"
        var spans = document.getElementsByTagName('span');
        for (var j = 0; j < spans.length; j++) {
          var sp = spans[j];
          var txt = sp.innerText || '';
          if (txt.indexOf("can't load Google Maps") !== -1) {
            var box = sp;
            for (var d2 = 0; d2 < 6 && box && box.parentElement && box.parentElement !== document.body; d2++) {
              if (box.style && (box.style.backgroundColor === 'white' || box.style.padding === '15px 25px')) {
                box.remove();
                break;
              }
              box = box.parentElement;
            }
          } else if (txt.indexOf('For development purposes only') !== -1) {
            // Remove the watermark and its parent dark overlay container
            var darkOverlay = sp.closest('div[style*="rgba(0, 0, 0, 0.5)"]') || sp.parentElement;
            while (darkOverlay && darkOverlay.parentElement && darkOverlay.parentElement.className !== 'gm-style') {
              if (darkOverlay.style && (darkOverlay.style.zIndex === '100' || darkOverlay.style.backgroundColor.indexOf('rgba(0, 0, 0') !== -1)) {
                break;
              }
              darkOverlay = darkOverlay.parentElement;
            }
            if (darkOverlay && darkOverlay.parentElement) {
              darkOverlay.remove();
            } else if (sp.parentElement) {
              sp.parentElement.remove();
            }
          }
        }

        // 3. Remove .gm-err-*
        var errs = document.querySelectorAll('.gm-err-container, .gm-err-content, [class*="gm-err"]');
        for (var k = 0; k < errs.length; k++) {
          errs[k].remove();
        }

        // 4. Remove dark overlays covering the tiles
        var darkDivs = document.querySelectorAll('.gm-style div[style*="rgba(0, 0, 0, 0.5)"], .gm-style div[style*="rgba(0,0,0,0.5)"]');
        for (var m = 0; m < darkDivs.length; m++) {
          darkDivs[m].remove();
        }
      } catch (_) {}
    }, 50);

    // Intercept Google Maps constructor so gestureHandling is greedy by default.
    // Also isolate touch/wheel events on the map element so scrolling/dragging inside the map
    // never bubbles up or drags the outer browser page.
    (function() {
      if (window.google && window.google.maps && window.google.maps.Map) {
        var OriginalMap = window.google.maps.Map;
        window.google.maps.Map = function(element, options) {
          options = options || {};
          options.gestureHandling = 'greedy';
          var mapInstance = new OriginalMap(element, options);
          if (element && element.addEventListener) {
            var stopProp = function(e) {
              e.stopPropagation();
            };
            element.addEventListener('wheel', stopProp, { passive: false });
            element.addEventListener('touchmove', stopProp, { passive: false });
          }
          return mapInstance;
        };
        window.google.maps.Map.prototype = OriginalMap.prototype;
      }
    })();
  </script>

  <script>
    // Pre-Trip Safety & Driver Verification External Notification Engine
    window.TransportSafety = {
      requestPermission: async function() {
        if ('Notification' in window) {
          try {
            return await Notification.requestPermission();
          } catch(e) {}
        }
        return 'denied';
      },
      showNotification: function(title, body, isRejected) {
        if ('Notification' in window) {
          if (Notification.permission === 'granted') {
            try {
              new Notification(title, {
                body: body,
                icon: 'favicon.png',
                tag: 'safety-alert-' + Date.now(),
                requireInteraction: isRejected ? true : false
              });
            } catch (e) {
              console.warn('Notification error:', e);
            }
          } else if (Notification.permission !== 'denied') {
            Notification.requestPermission().then(function(perm) {
              if (perm === 'granted') {
                new Notification(title, {
                  body: body,
                  icon: 'favicon.png'
                });
              }
            });
          }
        }
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            var ctx = new AudioCtx();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            if (isRejected) {
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(660, ctx.currentTime);
              osc.frequency.setValueAtTime(440, ctx.currentTime + 0.16);
              osc.frequency.setValueAtTime(660, ctx.currentTime + 0.32);
              gain.gain.setValueAtTime(0.3, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
              osc.start(ctx.currentTime);
              osc.stop(ctx.currentTime + 0.6);
            } else {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(523.25, ctx.currentTime);
              osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
              osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.22);
              gain.gain.setValueAtTime(0.25, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
              osc.start(ctx.currentTime);
              osc.stop(ctx.currentTime + 0.45);
            }
          }
        } catch(err) {
          console.warn('Audio buzzer error:', err);
        }
      },
      pickDriverPhoto: function(useCamera, callback) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        if (useCamera) {
          input.setAttribute('capture', 'user');
        }
        input.onchange = function(e) {
          if (!e.target.files || !e.target.files[0]) return;
          var file = e.target.files[0];
          var reader = new FileReader();
          reader.onload = function(evt) {
            var original = evt.target.result;
            var image = new Image();
            image.onload = function() {
              try {
                var maxSide = 960;
                var scale = Math.min(1, maxSide / Math.max(image.width, image.height));
                var canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(image.width * scale));
                canvas.height = Math.max(1, Math.round(image.height * scale));
                var context = canvas.getContext('2d');
                context.drawImage(image, 0, 0, canvas.width, canvas.height);
                var compressed = canvas.toDataURL('image/jpeg', 0.72);
                if (typeof callback === 'function') callback(compressed);
              } catch (_) {
                if (typeof callback === 'function') callback(original);
              }
            };
            image.onerror = function() {
              if (typeof callback === 'function') callback(original);
            };
            image.src = original;
          };
          reader.readAsDataURL(file);
        };
        input.click();
      }
    };
  </script>

  <script>
    // Remove legacy Flutter service workers before loading the application.
    (async function bootLatestTransportOne() {
      const hadController =
          'serviceWorker' in navigator && navigator.serviceWorker.controller;
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) =>
          registration.unregister()
        ));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }
      if (hadController &&
          sessionStorage.getItem('transport-one-sw-cleared') !== '1') {
        sessionStorage.setItem('transport-one-sw-cleared', '1');
        location.reload();
      }
    })();
  </script>
